<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fejlesztés alatt · NEZOR</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0e1f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f1226'/%3E%3Cpath d='M7 17V7l10 10V7' fill='none' stroke='%2300e5ff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1f;--bg2:#0f1226;
    --ink:#e5eaf2;--ink-dim:#9aa3b8;
    --blue:#2563EB;--blue-lt:#60A5FA;--cyan:#00e5ff;
    --font:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1100px 720px at 50% -10%,#141a36 0%,var(--bg2) 42%,var(--bg) 100%);
    color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100dvh;overflow:hidden;position:relative;
  }
  /* soft depth glows */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;opacity:.5;pointer-events:none}
  body::before{width:520px;height:520px;left:-120px;top:-140px;background:radial-gradient(circle,rgba(0,229,255,.28),transparent 70%)}
  body::after{width:560px;height:560px;right:-160px;bottom:-180px;background:radial-gradient(circle,rgba(37,99,235,.30),transparent 70%)}

  .shell{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:0}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--cyan);background:rgba(0,229,255,.09);border:1px solid rgba(0,229,255,.25);
    padding:.5em .85em;border-radius:99px;margin-bottom:8px}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  /* interactive particle name */
  .stage{width:100%;max-width:940px;height:min(46vh,380px);position:relative;touch-action:none;cursor:crosshair}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .lead{margin-top:4px;color:var(--ink-dim);font-size:clamp(15px,3.6vw,18px);max-width:44ch}

  .credit{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .credit .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
  .cta{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#04121e;
    background:linear-gradient(135deg,var(--cyan),#38bdf8);padding:14px 26px;border-radius:99px;text-decoration:none;
    box-shadow:0 10px 30px -10px rgba(0,229,255,.6);transition:transform .15s,box-shadow .15s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px -12px rgba(0,229,255,.8)}
  .cta svg{width:17px;height:17px}
  .mail{color:var(--ink-dim);font-size:14.5px;text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
  .mail:hover{color:var(--cyan);border-color:var(--cyan)}
  .mail b{color:var(--ink);font-weight:600}

  .hint{position:fixed;left:0;right:0;bottom:20px;z-index:2;text-align:center;color:rgba(154,163,184,.6);
    font-size:12.5px;pointer-events:none;padding:0 20px}
  @media (max-width:520px){ .stage{height:min(34vh,260px)} .credit{margin-top:24px} }
</style>
</head>
<body>
  <main class="shell">
    <span class="eyebrow"><span class="dot"></span> Fejlesztés alatt</span>

    <div class="stage" id="stage">
      <canvas id="c"></canvas>
    </div>

    <div class="credit">
      <span class="cap">Weboldalt és hirdetéseket készít</span>
      <a class="cta" href="https://nezor.hu" target="_blank" rel="noopener">
        nezor.hu
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
      <a class="mail" href="mailto:info@nezor.hu">Kapcsolat: <b>info@nezor.hu</b></a>
    </div>
  </main>

<script>
(function(){
  var stage=document.getElementById('stage'), cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1, parts=[], mouse={x:-9999,y:-9999,active:false};
  var TEXT="NEZOR";

  function lerp(a,b,t){return a+(b-a)*t;}
  function colorAt(t){ // cyan -> blue across the word
    var r=Math.round(lerp(0,96,t)), g=Math.round(lerp(229,165,t)), b=Math.round(lerp(255,250,t));
    return 'rgba('+r+','+g+','+b+',';
  }

  function build(){
    var rect=stage.getBoundingClientRect();
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,Math.round(rect.width)); H=Math.max(1,Math.round(rect.height));
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);

    // render text offscreen to sample pixels
    var oc=document.createElement('canvas'); oc.width=W; oc.height=H;
    var o=oc.getContext('2d');
    var fs=Math.min(H*0.82, W*0.9);
    o.font='900 '+fs+'px '+ 'Inter, system-ui, sans-serif';
    var tw=o.measureText(TEXT).width;
    if(tw>W*0.9){ fs=fs*(W*0.9/tw); o.font='900 '+fs+'px Inter, system-ui, sans-serif'; }
    o.fillStyle='#fff'; o.textAlign='center'; o.textBaseline='middle';
    o.fillText(TEXT, W/2, H/2+ fs*0.02);

    var data;
    try{ data=o.getImageData(0,0,W,H).data; }catch(e){ data=null; }
    var pts=[];
    if(data){
      var step = W<560?4:3;
      for(var y=0;y<H;y+=step){ for(var x=0;x<W;x+=step){ if(data[(y*W+x)*4+3]>128) pts.push([x,y]); } }
    }
    // cap for performance
    var CAP=3400;
    if(pts.length>CAP){ var keep=[], stride=pts.length/CAP; for(var i=0;i<CAP;i++) keep.push(pts[(i*stride)|0]); pts=keep; }

    var prev=parts; parts=[];
    for(var j=0;j<pts.length;j++){
      var tx=pts[j][0], ty=pts[j][1];
      var src = prev[j] || null;
      parts.push({
        x: src?src.x:(W/2+(Math.random()-.5)*W),
        y: src?src.y:(H/2+(Math.random()-.5)*H),
        vx:0, vy:0, tx:tx, ty:ty,
        col: colorAt(tx/W),
        k: 0.012+Math.random()*0.02,
        r: 1.2+Math.random()*1.1
      });
    }
  }

  function burst(mx,my){
    for(var i=0;i<parts.length;i++){
      var p=parts[i], dx=p.x-mx, dy=p.y-my, d=Math.hypot(dx,dy)||1;
      var force=Math.min(26, 4200/(d));
      p.vx+=dx/d*force; p.vy+=dy/d*force;
    }
  }

  var R=92, R2=R*R;
  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      // spring home
      p.vx+=(p.tx-p.x)*p.k;
      p.vy+=(p.ty-p.y)*p.k;
      // mouse repel
      if(mouse.active){
        var dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
        if(d2<R2){ var d=Math.sqrt(d2)||1, f=(1-d/R)*7; p.vx+=dx/d*f; p.vy+=dy/d*f; }
      }
      // shimmer + damping
      p.vx=(p.vx+(Math.random()-.5)*0.15)*0.86;
      p.vy=(p.vy+(Math.random()-.5)*0.15)*0.86;
      p.x+=p.vx; p.y+=p.vy;
      // brighten when moving fast
      var sp=Math.min(1, (Math.abs(p.vx)+Math.abs(p.vy))/8);
      ctx.fillStyle=p.col+(0.55+sp*0.45).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+sp*1.4,0,6.283); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }

  // input (coords relative to stage)
  function toLocal(cx,cy){ var r=stage.getBoundingClientRect(); return {x:cx-r.left,y:cy-r.top}; }
  stage.addEventListener('mousemove',function(e){ var l=toLocal(e.clientX,e.clientY); mouse.x=l.x; mouse.y=l.y; mouse.active=true; });
  stage.addEventListener('mouseleave',function(){ mouse.active=false; });
  stage.addEventListener('mousedown',function(e){ var l=toLocal(e.clientX,e.clientY); burst(l.x,l.y); });
  stage.addEventListener('touchstart',function(e){ var t=e.touches[0]; if(!t)return; var l=toLocal(t.clientX,t.clientY); mouse.x=l.x;mouse.y=l.y;mouse.active=true; burst(l.x,l.y); },{passive:true});
  stage.addEventListener('touchmove',function(e){ var t=e.touches[0]; if(!t)return; var l=toLocal(t.clientX,t.clientY); mouse.x=l.x;mouse.y=l.y;mouse.active=true; },{passive:true});
  stage.addEventListener('touchend',function(){ mouse.active=false; },{passive:true});

  var rt;
  window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(build,180); });

  function boot(){ build(); frame(); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(boot); setTimeout(function(){ if(!parts.length) boot(); },600); }
  else boot();
})();
</script>
</body>
</html>
