<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headline-válogató — Fiák Balázs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;--card:#FFFFFF;--ink:#26301F;--ink-dim:#6B7263;
    --green:#3F6B44;--green-deep:#28422C;--green-pale:#E7EEE4;
    --brown:#9C6B3E;--brown-deep:#6E4526;--line:rgba(38,48,31,.13);
    --r-md:18px;--maxw:820px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"PT Sans",system-ui,sans-serif;line-height:1.5;padding:40px 20px 100px}
  .wrap{max-width:var(--maxw);margin:0 auto}
  header{margin-bottom:32px}
  header h1{font-family:"PT Sans";font-size:22px;margin-bottom:8px}
  header p{color:var(--ink-dim);font-size:14.5px;max-width:62ch}
  .grid{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:24px 28px}
  .tag{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .num{font-family:"PT Sans";font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brown-deep);background:var(--green-pale);padding:3px 9px;border-radius:999px}
  .angle{font-family:"PT Sans";font-size:12px;color:var(--ink-dim);font-weight:600}
  h2.sample{font-family:"Roboto Slab",serif;font-weight:700;font-size:clamp(21px,3.2vw,30px);line-height:1.15;letter-spacing:-.005em}
  h2.sample em{font-style:normal;color:var(--brown)}
  .lead{margin-top:10px;font-size:14.5px;color:var(--ink-dim);max-width:56ch}
  footer{margin-top:36px;text-align:center;color:var(--ink-dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>12 headline-variáció — „ne dőljön a házra, hívjon szakembert”</h1>
    <p>Egy jelentés, más-más megfogalmazásban: a fa veszélyezteti a házat, a megoldás egy hívás. Ugyanaz a betűtípus (Roboto Slab 700) és lead-szöveg.</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Mondd meg a számát (pl. „a 5-ös”), és arra állítom át az élő oldalt.</footer>
</div>
<script>
  var variants = [
    {angle:"Jelenlegi", h:"Ne hagyja, hogy a fa a <em>házára</em> dőljön. Hívjon szakembert."},
    {angle:"Fa mint szereplő", h:"A fa nem kérdez engedélyt, mielőtt a <em>házára</em> dől."},
    {angle:"Kontraszt", h:"Inkább hívjon <em>szakembert</em>, mint a biztosítót."},
    {angle:"Időzítés", h:"Egy telefon, mielőtt a fa <em>döntene</em> ön helyett."},
    {angle:"Konkrét kép", h:"Ne a tetőn landoljon — <em>hívjon</em>, amíg még lehet."},
    {angle:"Otthon-védelem", h:"A háza nem kockáztatás. <em>Hívjon szakembert</em> időben."},
    {angle:"Mi már ott vagyunk", h:"Mielőtt a fa a házára dől, <em>mi már ott vagyunk</em>."},
    {angle:"Sorsdöntés", h:"Ne várja meg, hogy a fa <em>döntsön</em> a háza sorsáról."},
    {angle:"Egyszerű ígéret", h:"A biztonságos otthon egy <em>hívással</em> kezdődik."},
    {angle:"Rövid, ütős", h:"Hívjon, mielőtt a fa <em>magától dönt</em>."},
    {angle:"Vihar-hivatkozás", h:"A háza védelme nem várhat a <em>következő viharig</em>."},
    {angle:"Direkt CTA", h:"Ne kockáztassa az otthonát — <em>hívjon fakivágó szakembert</em>."}
  ];
  var grid = document.getElementById('grid');
  variants.forEach(function(v,i){
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="tag"><span class="num">' + (i+1) + '</span><span class="angle">' + v.angle + '</span></div>' +
      '<h2 class="sample">' + v.h + '</h2>' +
      '<p class="lead">Megdőlt, korhadt vagy épület mellé nőtt fa a telkén? Minél tovább vár, annál nagyobb a kockázat — és annál drágább a kivágás.</p>';
    grid.appendChild(card);
  });
</script>
</body>
</html>
