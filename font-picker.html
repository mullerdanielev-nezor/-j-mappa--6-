<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betűtípus-válogató — Fiák Balázs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Source+Serif+4:wght@400;700&family=Lora:wght@400;700&family=Vollkorn:wght@400;700&family=Domine:wght@400;700&family=Spectral:wght@400;700&family=Crimson+Pro:wght@400;700&family=Newsreader:wght@400;700&family=Petrona:wght@400;700&family=Bitter:wght@400;700&family=Zilla+Slab:wght@400;700&family=Roboto+Slab:wght@400;700&family=Arvo:wght@400;700&family=Rokkitt:wght@400;700&family=Alegreya:wght@400;700&family=Cormorant:wght@500;700&family=Libre+Caslon+Text:wght@400;700&family=Playfair+Display:wght@500;700&family=Frank+Ruhl+Libre:wght@400;700&family=IBM+Plex+Serif:wght@400;700&family=Noto+Serif:wght@400;700&family=EB+Garamond:wght@500;700&family=Merriweather:wght@400;700&family=Bree+Serif&family=Yeseva+One&family=Abril+Fatface&family=Josefin+Sans:wght@400;700&family=Cabin:wght@400;700&family=Karla:wght@400;700&family=Public+Sans:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;--bg-alt:#F1EADD;--card:#FFFFFF;
    --ink:#26301F;--ink-dim:#6B7263;
    --green:#3F6B44;--green-deep:#28422C;--green-pale:#E7EEE4;
    --brown:#9C6B3E;--brown-deep:#6E4526;
    --line:rgba(38,48,31,.13);--r-md:18px;--maxw:900px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"PT Sans",system-ui,sans-serif;line-height:1.5;padding:40px 20px 100px}
  .wrap{max-width:var(--maxw);margin:0 auto}
  header{margin-bottom:36px}
  header h1{font-family:"PT Sans";font-size:24px;margin-bottom:8px}
  header p{color:var(--ink-dim);font-size:14.5px;max-width:60ch}
  .toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .toolbar label{font-size:13px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .toolbar input[type=range]{width:160px}
  .grid{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:22px 26px}
  .tag{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .num{font-family:"PT Sans";font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brown-deep);background:var(--green-pale);padding:3px 9px;border-radius:999px}
  .fontname{font-family:"PT Sans";font-size:12.5px;font-weight:700;color:var(--green-deep)}
  .sample{font-size:clamp(22px,4vw,34px);line-height:1.12;font-weight:var(--w,700)}
  .sample em{font-style:normal;color:var(--brown)}
  .sub{margin-top:8px;font-family:"PT Sans";font-size:13.5px;color:var(--ink-dim)}
  footer{margin-top:40px;text-align:center;color:var(--ink-dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>30 betűtípus-opció — hero címsor összehasonlítás</h1>
    <p>Ugyanaz a mondat, 30 különböző betűtípussal, a valós szín- és méretkontextusban. Alapból félkövér (700-as) súllyal — a kapcsolóval visszaválthatsz normálra, hogy összevesd.</p>
    <div class="toolbar">
      <label><input type="checkbox" id="boldToggle" checked> Félkövér (700) nézet</label>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Mondd meg a számát (pl. „a 14-es”), és arra állítom át az oldalt.</footer>
</div>
<script>
  var fonts = [
    "PT Serif","Source Serif 4","Lora","Vollkorn","Domine",
    "Spectral","Crimson Pro","Newsreader","Petrona","Bitter",
    "Zilla Slab","Roboto Slab","Arvo","Rokkitt","Alegreya",
    "Cormorant","Libre Caslon Text","Playfair Display","Frank Ruhl Libre","IBM Plex Serif",
    "Noto Serif","EB Garamond","Merriweather","Bree Serif","Yeseva One",
    "Abril Fatface","Josefin Sans","Cabin","Karla","Public Sans"
  ];
  var grid = document.getElementById('grid');
  fonts.forEach(function(f,i){
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="tag"><span class="num">' + (i+1) + '</span><span class="fontname">' + f + '</span></div>' +
      '<div class="sample" style="font-family:\'' + f + '\'">Az a fa nem magától fog <em>kidőlni</em>.</div>' +
      '<div class="sub">Megdőlt, korhadt vagy épület mellé nőtt fa a telkén? Díjmentes felmérés, fix ár.</div>';
    grid.appendChild(card);
  });
  document.getElementById('boldToggle').addEventListener('change', function(e){
    document.documentElement.style.setProperty('--w', e.target.checked ? '700' : '400');
  });
</script>
</body>
</html>
